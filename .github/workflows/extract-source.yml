name: Extract source ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[source-extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source without nested workflows
        shell: bash
        run: |
          set -euo pipefail
          ZIP="commerce_pickup_platform_AUTOPSY_FIXED_STEP9.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Source ZIP not present; nothing to extract."
            exit 0
          fi
          unzip -o "$ZIP" -d . -x '.github/workflows/*'
          rm -f "$ZIP"

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract application source [source-extracted]"
          git push
