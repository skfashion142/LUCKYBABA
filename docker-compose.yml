services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: commerce_pickup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - commerce_pg:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me-long
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - commerce_minio:/data
volumes:
  commerce_pg:
  commerce_minio:
